name: One-time sync test expectation fix

on:
  push:
    branches:
      - fix/bulk-edit-reliability

permissions:
  contents: write

jobs:
  fix-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bulk-edit-reliability
      - name: Update exact stale-ToDo expectation and remove this workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('FavGCalSchedulerClone.Tests/SyncTodoCleanupEditRaceRegressionTests.cs')
          text = path.read_text(encoding='utf-8')
          old = '''            Assert.Equal(0, api.UpdateCallCount);\n            Assert.Equal(1, result.Skipped);\n            Assert.Equal(1, result.Conflicts);\n'''
          new = '''            Assert.Equal(0, api.UpdateCallCount);\n            Assert.Equal(1, result.Skipped);\n            Assert.Equal(0, result.Conflicts);\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one stale-ToDo assertion block, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='')
          PY
          rm .github/workflows/one-time-test-expectation-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FavGCalSchedulerClone.Tests/SyncTodoCleanupEditRaceRegressionTests.cs .github/workflows/one-time-test-expectation-fix.yml
          git commit -m "test: classify stale todo cleanup as safe skip"
          git push origin HEAD:fix/bulk-edit-reliability
