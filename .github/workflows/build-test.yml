name: Build and test

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore FavGCalSchedulerClone.sln
      - name: Build
        run: dotnet build FavGCalSchedulerClone.sln --configuration Release --no-restore
      - name: Publish self-contained Windows app
        run: dotnet publish .\FavGCalSchedulerClone.App\FavGCalSchedulerClone.App.csproj --configuration Release --runtime win-x64 --self-contained true --output .\artifacts\FavGCalSchedulerClone-win-x64
      - name: Smoke test published app startup
        shell: pwsh
        run: |
          $exe = Resolve-Path ".\artifacts\FavGCalSchedulerClone-win-x64\FavGCalSchedulerClone.App.exe"
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($process.HasExited) {
              throw "Published app exited during startup with exit code $($process.ExitCode)."
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: FavGCalSchedulerClone-win-x64
          path: artifacts/FavGCalSchedulerClone-win-x64
      - name: Test
        run: dotnet test FavGCalSchedulerClone.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
