name: Build and test

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore FavGCalSchedulerClone.sln
      - name: Build
        run: dotnet build FavGCalSchedulerClone.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test FavGCalSchedulerClone.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
